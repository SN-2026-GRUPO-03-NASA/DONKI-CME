name: Update Data

on:
  schedule:
    # Executa diariamente às 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Validate NASA API key
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          if [ -z "$NASA_API_KEY" ]; then
            echo "::error::O secret NASA_API_KEY não está configurado ou está vazio."
            exit 1
          fi
          echo "NASA_API_KEY configurada (${#NASA_API_KEY} caracteres)."

      - name: Run NASA data fetch pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python scripts/fetch_nasa.py
